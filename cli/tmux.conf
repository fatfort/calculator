# tmux bindings for the FatFort calculators.
#
# Install: append to ~/.tmux.conf, then `tmux source-file ~/.tmux.conf`
# Requires tmux 3.2+ for display-popup (you have 3.3a on the server; check your
# Mac with `tmux -V` — Homebrew's is current, but Apple ships nothing).

# ── prefix + c ──────────────────────────────────────────────────────────────
# Calculator picker in a floating popup, over whatever you were doing. The
# popup is closed by the command exiting, so -E returns you straight back.
bind-key c display-popup -E -w 80% -h 70% \
  "command -v tv >/dev/null \
     && tv calc \
     || calc list | fzf --preview 'calc describe {}' --preview-window=right:55% \
        | xargs -r calc-run"

# ── prefix + C ──────────────────────────────────────────────────────────────
# Same, but against a locally running container rather than production.
bind-key C display-popup -E -w 80% -h 70% \
  "CALC_API=http://127.0.0.1:27439/api sh -c '\
     command -v tv >/dev/null && tv calc \
     || calc list | fzf --preview \"calc describe {}\" | xargs -r calc-run'"

# ── prefix + S ──────────────────────────────────────────────────────────────
# sesh session switcher. Kept next to the above because in practice you reach
# for them together: pick the project, then pick the tool.
bind-key S display-popup -E -w 60% -h 60% \
  "sesh connect \"$(sesh list --icons | fzf --ansi --no-sort --prompt 'session ')\""

# One-shot scratch calculation without leaving the current pane: prompts for a
# whole `calc ...` command line and prints the answer in a popup.
bind-key M-c command-prompt -p "calc:" \
  "display-popup -E -w 60% -h 40% 'calc %% ; read -rsn1 -p \"\" _'"
